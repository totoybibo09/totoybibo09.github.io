<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMT Scatter Machine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}
.container{max-width:380px;margin:auto;background:#111;border:2px solid gold;border-radius:20px;padding:20px}
h1{color:gold;margin-bottom:10px}
.balance{font-size:20px;margin:15px 0;color:gold}
.reels{display:flex;gap:10px;justify-content:center;margin:20px 0}
.reel{width:90px;height:90px;background:#222;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:50px;border:2px solid #333}
button{background:gold;color:#000;border:none;padding:15px;width:100%;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;margin:5px 0}
button:active{transform:scale(0.95)}
.log{color:#0f0;margin-top:10px;height:20px}
</style>
</head>
<body>
<div class="container">
<h1>💎 AMT SCATTER</h1>
<div class="balance">Balance: <span id="bal">0</span> AMT</div>
<div class="reels">
<div class="reel" id="r1">⭐</div>
<div class="reel" id="r2">⭐</div>
<div class="reel" id="r3">⭐</div>
</div>
<button onclick="spin()">🎰 SCATTER</button>
<button onclick="claim()" style="background:#0f0">CLAIM</button>
<div class="log" id="log">Click SCATTER to mine!</div>
<p style="font-size:11px;color:#666;margin-top:15px">⭐⭐⭐=100 AMT | 💎💎💎=1000 AMT | ⭐⭐=10 AMT</p>
</div>

<script>
let bal = Number(localStorage.getItem('amt')||0);
document.getElementById('bal').innerText = bal;
const sym = ['⭐','💎','🔥','💰','⚡'];

function spin(){
  let i=setInterval(()=>{
    r1.innerText=sym[Math.random()*5|0];
    r2.innerText=sym[Math.random()*5|0];
    r3.innerText=sym[Math.random()*5|0];
  },70);
  setTimeout(()=>{
    clearInterval(i);
    let a=sym[Math.random()*5|0], b=sym[Math.random()*5|0], c=sym[Math.random()*5|0];
    if(Math.random()<0.3){a='⭐';b='⭐'}
    if(Math.random()<0.08){a='⭐';b='⭐';c='⭐'}
    r1.innerText=a; r2.innerText=b; r3.innerText=c;
    let win=1, msg='';
    if(a==='⭐'&&b==='⭐'&&c==='⭐'){win=100;msg='JACKPOT 100 AMT!';}
    else if(a==='💎'&&b==='💎'&&c==='💎'){win=1000;msg='MEGA 1000 AMT!!!';}
    else if(a===b||b===c||a===c){win=10;msg='+10 AMT!';}
    else{win=1;msg='+1 AMT';}
    bal+=win; localStorage.setItem('amt',bal);
    document.getElementById('bal').innerText=bal;
    document.getElementById('log').innerText=msg;
  },1000);
}
function claim(){ alert(bal+' AMT ready to claim!'); }
</script>
</body>
</html>
